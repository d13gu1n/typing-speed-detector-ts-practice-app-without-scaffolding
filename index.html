<html>
    <head>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: Arial, sans-serif;
                background: #f4f4f4;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                flex-direction: column;
            }
            .box {
                text-align: center;
                background: #fff;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                width: 400px;
            }
            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }
            #txt {
                font-size: 18px;
                margin-bottom: 20px;
                font-weight: bold;
            }
            #inp {
                width: 100%;
                height: 100px;
                font-size: 16px;
                padding: 10px;
                margin-bottom: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
                resize: none;
            }
            .stats {
                display: flex;
                justify-content: space-between;
                margin-top: 20px;
            }
            button {
                padding: 10px 20px;
                background: #4caf50;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            button:disabled {
                background: #ccc;
            }
            button:hover {
                background: #45a049;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h1>Typing Speed Test</h1>
            <p id="txt">Press Start to begin typing</p>
            <textarea id="inp" placeholder="Start typing here..."></textarea>
            <div class="stats">
                <p id="tm">Time: 0s</p>
                <p id="wpm">WPM: 0</p>
                <button id="start">Start</button>
            </div>
        </div>
        <script defer>
            // TODO: Write TS code here...
            console.log("This is TS");
        </script>
    </body>
</html>
